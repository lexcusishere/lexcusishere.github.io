<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-label="Contribution streak">
  <style>
    .h { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,monospace; font-size: 15px; fill: #E6EDF3; letter-spacing: 1px; }
    .n { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,monospace; font-size: 34px; font-weight: 700; fill: #D4AF37; }
    .l { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size: 12px; fill: #8B949E; }
    .s { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size: 11px; fill: #8B949E; }
  </style>
  <rect width="560" height="250" rx="10" fill="#0D1117" stroke="#30363D"/>
  <text class="h" x="26" y="38">Streak</text>
  <path d="M26 50 H534" stroke="#30363D"/>
  <text class="l" x="95" y="96" text-anchor="middle">Current streak</text>
  <text class="n" x="95" y="146" text-anchor="middle">2</text>
  <text class="l" x="95" y="170" text-anchor="middle">days</text>
  <text class="l" x="280" y="96" text-anchor="middle">Longest streak</text>
  <text class="n" x="280" y="146" text-anchor="middle">2</text>
  <text class="l" x="280" y="170" text-anchor="middle">days</text>
  <text class="l" x="465" y="96" text-anchor="middle">This year</text>
  <text class="n" x="465" y="146" text-anchor="middle">42</text>
  <text class="l" x="465" y="170" text-anchor="middle">contributions</text>
  <path d="M26 212 H534" stroke="#30363D"/>
  <text class="s" x="26" y="234">Counted from the contribution calendar</text>
  <circle cx="95" cy="186" r="3" fill="#D4AF37"/>
</svg>
