<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-label="Session: current streak 2 days, best 2 days">
  <style>
    .h { font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace; font-size:15px; fill:#E6EDF3; letter-spacing:1px; }
    .n { font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace; font-size:58px; font-weight:700; fill:#E6EDF3; }
    .cnt { animation: count .7s steps(var(--steps,2),end) .45s both; }
    .u { font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace; font-size:13px; fill:#3FB950; animation: fade .5s ease-out .35s both; }
    .l { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size:11px; fill:#8B949E; letter-spacing:2px; text-transform:uppercase; animation: fade .5s ease-out .4s both; }
    .c { font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace; font-size:12px; fill:#8B949E; animation: fade .5s ease-out 1.6s both; }
    .w { animation: fade .3s ease-out both; }
    @keyframes fade { from { opacity:0; } to { opacity:1; } }
    @keyframes count { from { transform: translateY(var(--d)); } to { transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .n,.u,.l,.c,.w,.cnt { animation:none; opacity:1; transform:none; } }
  </style>
  <defs>
    <clipPath id="cs1"><rect x="24" y="82" width="84" height="56"/></clipPath>
    <clipPath id="cs2"><rect x="320" y="82" width="84" height="56"/></clipPath>
  </defs>
  <rect width="560" height="250" rx="10" fill="#0B0F14" stroke="#22303C"/>
